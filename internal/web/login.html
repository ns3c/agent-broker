<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Credential Broker</title>
<style>
:root {
  --bg: #f5f7fa; --panel: #ffffff; --line: #e1e6ed; --ink: #17202c; --muted: #5d6a7b;
  --deny: #c9302c; --accent: #b7791f;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0b1017; --panel: #111822; --line: #232d3b; --ink: #e6edf3; --muted: #93a1b3; --deny: #f85149; --accent: #f0b429; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
  background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
form { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 24px; }
h1 { margin: 0 0 4px; font-size: 18px; }
p { margin: 0 0 16px; color: var(--muted); }
label { display: block; font-weight: 500; margin-bottom: 6px; }
input { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button { margin-top: 14px; width: 100%; font: inherit; font-weight: 600; border: 0; border-radius: 6px; padding: 9px; cursor: pointer; background: var(--accent); color: #17202c; }
.err { color: var(--deny); margin: 10px 0 0; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Anthropic Demo</h1>
  <p>Enter the demo password to continue.</p>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
  <p class="err" id="err" hidden>That password isn't right.</p>
  <button type="submit">Continue</button>
</form>
<script>
if (new URLSearchParams(location.search).has("error")) document.getElementById("err").hidden = false;
</script>
</body>
</html>
